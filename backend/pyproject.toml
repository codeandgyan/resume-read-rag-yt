[project]
name = "resume-reader"
version = "0.1.0"
description = "API that answers questions about one uploaded resume."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.6",
  "pgvector>=0.3.6",
  "psycopg[binary,pool]>=3.2.4",
  "pydantic-settings>=2.7.0",
  "pymupdf>=1.24,<2",
  "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resume_reader"]

[tool.hatch.build.targets.wheel.force-include]
"src/resume_reader/schema.sql" = "resume_reader/schema.sql"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
