services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: resume_reader
    ports:
      - "5432:5432"
    volumes:
      - resume_reader_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d resume_reader"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

volumes:
  resume_reader_pg:
